[project]
name = "inwatch"
version = "0.1.0"
description = "Banco de experimentos visuales sobre riesgo delictivo latente bajo sesgo de denuncia"
readme = "README.md"
# city2graph exige 3.12-3.14. El tope es real, no defensivo.
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # Base, no opcional: este es un proyecto de estadística. Los loaders calculan
    # intervalos, bootstrap y distribuciones. Dejarlo en un extra obliga a instalar
    # torch en CI sólo para correr un test de lógica pura.
    "scipy>=1.14",
]

[project.optional-dependencies]
# Unidades espaciales y grafos. city2graph arrastra geopandas/networkx/torch-geometric.
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "h3>=4.0",
    "city2graph>=1.0",
]
# Modelos. Separado de `geo` porque torch pesa y no todo experimento lo necesita.
ml = [
    "torch>=2.4",
    "torch-geometric>=2.6",
    "scikit-learn>=1.5",
]
# Capa de presentación. marimo corre los notebooks; matplotlib genera figuras estáticas.
viz = [
    "marimo>=0.23",
    "matplotlib>=3.9",
    "pydeck>=0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
canon = "inwatch.canon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inwatch"]

[tool.inwatch.canon]
# Dónde vive el registro y qué docs se vigilan por anclas `CANON:`.
# En infelix esto estaba hardcodeado en constantes de módulo; acá es config.
registry = "registry/canonical_numbers.json"
watched = [
    "analysis/*.md",
    # `[!_]*` excluye `_template/`: una plantilla contiene sintaxis de ancla de
    # ejemplo, y el guard de anclas malformadas la leería como un ancla rota.
    "experiments/[!_]*/README.md",
    "design/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "experiments", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# En marimo la última expresión de una celda ES el render; B018 la lee como código
# muerto. Es el idioma de la herramienta, no un descuido.
"experiments/**/notebook.py" = ["B018"]

[tool.pytest.ini_options]
# `experiments` está acá para que CI recoja los tests que viven junto a cada loader.
# Sin esto, `uv run pytest` los saltaría en silencio y el gate sería decorativo.
testpaths = ["tests", "experiments"]
addopts = "-q --strict-markers"
markers = [
    "needs_data: requiere artefactos de data/ que están gitignored",
]
