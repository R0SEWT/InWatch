# Catálogo de fuentes — hand-written, versionado.
#
# Cada dataset que un experimento lee se nombra acá una vez. El código pide
# `fuentes.ruta("<nombre>")` y nunca escribe una ruta de máquina.
#
# Orden de resolución (ver src/inwatch/fuentes/resolucion.py):
#   1. INWATCH_FUENTE_<NOMBRE>       override puntual
#   2. data/lake/<lake>              copia local de bocho: la fuente principal
#   3. <curado>                      insumo chico versionado en el repo (existe al clonar)
#   4. data/bronze/fuentes/<nombre>/ lo exportado con `fuentes exportar`
#   5. <origen>:<ruta>               transición, solo lectura (infelix, wachi)
#
# `git_ref` congela la fuente en un commit del origen: el archivo vivo NO la
# resuelve, hay que exportarla.

[lake]
# host:/ruta del silver en bocho. Pendiente del inventario (inwatch-iv1.3).
# Override: INWATCH_LAKE_REMOTO.
remoto = "PENDIENTE"

[origenes]
# Override por origen: INWATCH_ORIGEN_<NOMBRE>. Ambos son solo lectura.
infelix = "~/Code/tesis/infelix"
wachi = "~/Code/freelance-externos/ElComercio/Wachi"

# ─── denuncias ────────────────────────────────────────────────────────────────
[fuente.denuncias_lima]
descripcion = "3,1 M denuncias SIDPOL de Lima 2018-2025, con lat/long y fecha_hora"
titularidad = "Wachi / Lab-EC-UPC (datos SIDPOL)"
lake = "denuncias/LIMA.parquet"
transicion = ["wachi:data/raw/LIMA.parquet"]

