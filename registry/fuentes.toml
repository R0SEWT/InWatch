# Versionado en el repo, 38 KB: el grupo clona y corre, sin bocho ni infelix. Es la
# única copia que reproduce el grafo exacto (7.559 nodos): re-encodar el polígono a
# GeoJSON, aun a 1 cm de precisión, mueve el conteo en una o dos unidades.
