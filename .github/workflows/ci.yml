name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # `--extra geo` y no `uv sync` a secas: los tests de `tejido-vs-hexagono` hacen
      # `importorskip("city2graph")` y sin el extra se saltan enteros — el CI quedaría
      # verde sin haber verificado el experimento, que es peor que quedar rojo. El extra
      # no arrastra torch (eso vive en `ml`), así que el costo es geopandas y poco más.
      - name: Sync dependencies
        run: uv sync --extra geo

      - name: Lint
        run: uv run ruff check .

      # El enunciado del TP de Complex Networks pide un requirements.txt. Sale de uv.lock
      # y no se edita a mano: si alguien cambia una dependencia y no lo regenera, el
      # archivo que ve el docente describe otro entorno. Regenerar con el mismo comando.
      - name: requirements.txt en sincronía con uv.lock
        run: uv export --frozen --extra geo --extra viz --no-hashes --quiet | diff -u requirements.txt -

      # `data/` está gitignored, así que los tests marcados needs_data no pueden
      # correr acá. El marcador existía desde el andamiaje pero el CI no lo excluía:
      # todo test que tocara un parquet fallaba por diseño.
      - name: Test
        run: uv run pytest -q -m "not needs_data"

      # Corre sin datos a propósito: canon valida el registro y las anclas de los
      # docs, no los parquets. Que data/ esté gitignored no es excusa para no gatear.
      - name: Canon
        run: uv run canon check
