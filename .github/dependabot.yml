version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Git Flow: las actualizaciones entran a develop, y llegan a main con el release.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    # Git Flow: las actualizaciones entran a develop, y llegan a main con el release.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
